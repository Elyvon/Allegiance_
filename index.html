          return 'UA: ' + ua + '\nLang: ' + lang + '\nDeviceMemory: ' + mem + '\nWebGL2: ' + webgl2 + '\nWebGL1: ' + webgl1 + '\nGPU: ' + glInfo;
        }

        // 开屏背景：舆图。等高线与经纬格，朱红行军路线随加载进度延伸
        var 地图 = (function() {
          var 画布 = document.getElementById('loading-map'), 板 = 画布.getContext('2d');
          var 路线 = [[.16,.9],[.05,.72],[.05,.42],[.18,.2],[.4,.1],[.58,.2],[.78,.1],[.95,.3],[.95,.68],[.8,.9]];
          var 比 = 1, W = 0, H = 0, 底图 = null, 站 = [], 长 = [], 目标比例 = 0;

          function 建噪声(种子) {
            var 表 = new Float32Array(65536), i;
            for (i = 0; i < 65536; i++) {
              种子 = (种子 + 0x6D2B79F5) | 0;
              var t = Math.imul(种子 ^ (种子 >>> 15), 1 | 种子);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              表[i] = ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            }
            function 格(x, y) { return 表[((x & 255) << 8) | (y & 255)]; }
            function 噪(x, y) {
              var a = Math.floor(x), b = Math.floor(y), u = x - a, v = y - b;
              u = u * u * (3 - 2 * u); v = v * v * (3 - 2 * v);
              return (格(a, b) * (1 - u) + 格(a + 1, b) * u) * (1 - v) + (格(a, b + 1) * (1 - u) + 格(a + 1, b + 1) * u) * v;
            }
            return function(x, y) {
              var 和 = 0, 幅 = .5, 总 = 0;
              for (var k = 0; k < 4; k++) { 和 += 噪(x, y) * 幅; 总 += 幅; 幅 *= .5; x = x * 2.03 + 17; y = y * 2.03 + 31; }
              return 和 / 总;
            };
          }

          function 建图() {
            比 = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth; H = window.innerHeight;
            画布.width = Math.round(W * 比); 画布.height = Math.round(H * 比);
            板.setTransform(比, 0, 0, 比, 0, 0);
            底图 = document.createElement('canvas');
            底图.width = 画布.width; 底图.height = 画布.height;
            var c = 底图.getContext('2d'), 噪 = 建噪声(23), 步 = 9, 列 = Math.ceil(W / 步) + 1, 行 = Math.ceil(H / 步) + 1, 尺 = 1 / (Math.max(W, H) * .32), 值 = [], x, y;
            c.setTransform(比, 0, 0, 比, 0, 0);
            for (y = 0; y < 行; y++) { 值[y] = new Float32Array(列); for (x = 0; x < 列; x++) 值[y][x] = 噪(x * 步 * 尺, y * 步 * 尺); }
            // 等高线：逐格取阈值穿过的线段
            c.lineWidth = 1;
            for (var 级 = 0; 级 < 14; 级++) {
              var 阈 = .22 + 级 * .042;
              c.strokeStyle = 'rgba(104,71,52,' + (级 % 4 === 0 ? .34 : .17) + ')';
              c.beginPath();
              for (y = 0; y < 行 - 1; y++) for (x = 0; x < 列 - 1; x++) {
                var a = 值[y][x], b = 值[y][x + 1], d = 值[y + 1][x + 1], e = 值[y + 1][x], 点 = [];
                if ((a < 阈) !== (b < 阈)) 点.push([x + (阈 - a) / (b - a), y]);
                if ((b < 阈) !== (d < 阈)) 点.push([x + 1, y + (阈 - b) / (d - b)]);
                if ((e < 阈) !== (d < 阈)) 点.push([x + (阈 - e) / (d - e), y + 1]);
                if ((a < 阈) !== (e < 阈)) 点.push([x, y + (阈 - a) / (e - a)]);
                for (var k = 0; k + 1 < 点.length; k += 2) { c.moveTo(点[k][0] * 步, 点[k][1] * 步); c.lineTo(点[k + 1][0] * 步, 点[k + 1][1] * 步); }
              }
              c.stroke();
            }
            // 经纬格与图框
            var 格 = Math.max(W, H) / 8, 边 = Math.min(W, H) * .028;
            c.strokeStyle = 'rgba(104,71,52,.13)';
            c.beginPath();
            for (x = 格; x < W; x += 格) { c.moveTo(x, 0); c.lineTo(x, H); }
            for (y = 格; y < H; y += 格) { c.moveTo(0, y); c.lineTo(W, y); }
            c.stroke();
            c.strokeStyle = 'rgba(59,41,26,.6)'; c.lineWidth = 2; c.strokeRect(边, 边, W - 边 * 2, H - 边 * 2);
            c.lineWidth = 1; c.strokeRect(边 + 5, 边 + 5, W - (边 + 5) * 2, H - (边 + 5) * 2);
            // 中央文字区淡化
            c.globalCompositeOperation = 'destination-out';
            c.translate(W / 2, H / 2); c.scale(W * .46, H * .3);
            var 淡 = c.createRadialGradient(0, 0, 0, 0, 0, 1);
            淡.addColorStop(0, 'rgba(0,0,0,.92)'); 淡.addColorStop(.6, 'rgba(0,0,0,.8)'); 淡.addColorStop(1, 'rgba(0,0,0,0)');
            c.fillStyle = 淡; c.beginPath(); c.arc(0, 0, 1, 0, 6.3); c.fill();
            站 = 路线.map(function(s) { return [s[0] * W, s[1] * H]; });
            长 = [0];
            for (x = 1; x < 站.length; x++) 长[x] = 长[x - 1] + Math.hypot(站[x][0] - 站[x - 1][0], 站[x][1] - 站[x - 1][1]);
          }

          function 占到(比例) {
            目标比例 = 比例;
            板.clearRect(0, 0, W, H);
            板.drawImage(底图, 0, 0, W, H);
            var 总 = 长[长.length - 1] * 比例, i;
            板.strokeStyle = '#b5472b'; 板.lineWidth = 2.5; 板.setLineDash([9, 6]); 板.lineCap = 'round';
            板.beginPath(); 板.moveTo(站[0][0], 站[0][1]);
            for (i = 1; i < 站.length; i++) {
              if (长[i] <= 总) { 板.lineTo(站[i][0], 站[i][1]); continue; }
              var t = (总 - 长[i - 1]) / (长[i] - 长[i - 1]);
              板.lineTo(站[i - 1][0] + (站[i][0] - 站[i - 1][0]) * t, 站[i - 1][1] + (站[i][1] - 站[i - 1][1]) * t);
              break;
            }
            板.stroke(); 板.setLineDash([]);
            for (i = 0; i < 站.length; i++) {
              var 到 = 长[i] <= 总, 大 = 到 ? 6 : 4;
              板.fillStyle = 到 ? '#b5472b' : '#f7edd9';
              板.strokeStyle = 到 ? '#b5472b' : 'rgba(59,41,26,.6)'; 板.lineWidth = 1.5;
              板.beginPath(); 板.rect(站[i][0] - 大, 站[i][1] - 大, 大 * 2, 大 * 2); 板.fill(); 板.stroke();
            }
          }

          // 地图只是装饰：出错不能进入 Fatal Error
          function 安全(函数) { return function(参数) { try { 函数(参数); } catch (e) { console.warn(e); } }; }
          var 定时;
          window.addEventListener('resize', function() {
            clearTimeout(定时);
            定时 = setTimeout(安全(function() { 建图(); 占到(目标比例); }), 200);
          });
          安全(function() { 建图(); 占到(0); })();
          return { 占到: 安全(占到) };
        })();

        // 与加载器共用：加载器把各文件的已下载字节写进这个对象
        var 下载进度 = {};

        function updateProgress(progress) {
          var pct = Math.round(Math.min(1, progress) * 100);
          bar.style.width = pct + '%';
          pctEl.textContent = pct + '%';
          地图.占到(progress);
          // 加载器在 0~0.9 报告下载，之后是启动
          if (progress >= 0.9) { setPhase('游戏启动中…'); return; }
          var loaded = 0, total = 0;
          for (var k in 下载进度) { loaded += 下载进度[k].loaded || 0; total += 下载进度[k].total || 0; }
          setPhase('资源加载中…' + (total > 0 ? '  ' + (loaded / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB' : ''));
        }

        function setPhase(text) { if (phaseEl) phaseEl.textContent = text; }

        function 展示诊断(信息, 保留遮罩) {
          if (diagFull) {
            diagFull.innerHTML = '<h1>Fatal Error</h1>' + 信息;
            diagFull.classList.add('show');
          }
          // 保留/更新遮罩里的调试信息，方便对照。
          if (loading && !保留遮罩) loading.classList.add('hidden');
        }

        function esc(s) {
          return (s == null ? '' : String(s))
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/\n/g,'<br>');
        }

        window.addEventListener('error', function(e) {
          var m = 'GLOBAL_ERROR: ' + (e && e.message) + '<br>at ' + ((e && e.filename)||'') + ':' + ((e && e.lineno)||'');
          if (e && e.stack) m += '<br>' + esc(e.stack);
          展示诊断(m + '<br><br>' + esc(diagInfo()), true);
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var r = e && e.reason;
          var m = 'UNHANDLED_REJECTION: ' + (r && (r.message||r));
          if (r && r.stack) m += '<br>' + esc(r.stack);
          展示诊断(m + '<br><br>' + esc(diagInfo()), true);
        });

        try {
          createUnityInstance(document.querySelector('#unity-canvas'), {
            arguments: [],
            matchWebGLToCanvasSize: true,
            dataUrl: 'Build/5353ae5f04a83ff8d29a928c08f06ffe.data',
            frameworkUrl: 'Build/99cb32b5395a67d2541191d2d3fe405f.framework.js',
            codeUrl: 'Build/8f6b88a07974810036931d911c6b56ab.wasm',
            streamingAssetsUrl: 'StreamingAssets',
            companyName: 'Elyvon',
            productName: '天下归心',
            productVersion: '1.3.0',
            downloadProgress: 下载进度
          }, updateProgress).then(function(instance) {
            globalThis.unityInstance = instance;
            globalThis.gameInstance = instance;
            // 进入 Unity 世界：淡出遮罩，显示 Unity 画面。
            if (loading) {
              loading.classList.add('fade');
              setTimeout(function() { loading.classList.add('hidden'); }, 500);
            }
          }).catch(function(message) {
            setPhase('启动失败');
            展示诊断('UNITY_INIT_FAILED<br>' + esc(message) + '<br><br>' + esc(diagInfo()), true);
          });
        } catch(e) {
          展示诊断('UNITY_BOOT_EXCEPTION<br>' + esc(e && (e.stack || e.message || e)), true);
        }
      })();
    </script>
